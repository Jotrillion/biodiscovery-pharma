<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BioDiscovery Pharma | Paramètres</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="settings">
    <div class="app-layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">B</div>
          <h3>BioDiscovery</h3>
        </div>

        <nav class="nav-list">
          <div class="nav-item" data-page="dashboard" data-link="dashboard.html">Tableau de bord</div>
          <div class="nav-item" data-page="projects" data-link="projects.html">Projets</div>
          <div class="nav-item" data-page="targets" data-link="targets.html">Cibles</div>
          <div class="nav-item" data-page="molecules" data-link="molecules.html">Molécules</div>
          <div class="nav-item" data-page="reports" data-link="reports.html">Rapports</div>
          <div class="nav-item active" data-page="settings">Paramètres</div>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <h1>Paramètres et gestion utilisateur</h1>
          <button class="primary-btn" type="button">Enregistrer</button>
        </header>

        <section class="panel">
          <div class="panel-header">
            <h2>Profil utilisateur</h2>
          </div>

          <div class="auth-form">
            <label>
              <span>Nom complet</span>
              <input type="text" value="Dr. R. Martin" />
            </label>
            <label>
              <span>Email</span>
              <input type="email" value="researcher@biodiscovery.fr" />
            </label>
            <label>
              <span>Permissions</span>
              <input type="text" value="Recherche, gestion de projet, export" />
            </label>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
