<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BioDiscovery Pharma | Molécules</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="molecules">
    <div class="app-layout">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">B</div>
          <h3>BioDiscovery</h3>
        </div>

        <nav class="nav-list">
          <div class="nav-item" data-page="dashboard" data-link="dashboard.html">Tableau de bord</div>
          <div class="nav-item" data-page="projects" data-link="projects.html">Projets</div>
          <div class="nav-item" data-page="targets" data-link="targets.html">Cibles</div>
          <div class="nav-item active" data-page="molecules">Molécules</div>
          <div class="nav-item" data-page="reports" data-link="reports.html">Rapports</div>
          <div class="nav-item" data-page="settings" data-link="settings.html">Paramètres</div>
        </nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <h1>Découverte de molécules</h1>
          <button class="primary-btn" type="button">Comparer les composés</button>
        </header>

        <section class="panel">
          <div class="panel-header">
            <h2>Composés candidats</h2>
          </div>

          <div class="filter-bar">
            <input id="moleculeSearch" type="text" placeholder="Recherche par molécule, cible ou potentiel" />
          </div>

          <div id="moleculeSearchStatus" class="search-status">3 molécules affichées</div>

          <div class="table-wrap">
            <table class="standard-table">
              <thead>
                <tr>
                  <th>Molécule</th>
                  <th>Cible</th>
                  <th>Similitude</th>
                  <th>Potentiel</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="moleculeTableBody">
                <tr data-search="Gefitinib EGFR très élevé MAPK PI3K">
                  <td>Gefitinib</td>
                  <td>EGFR</td>
                  <td>92%</td>
                  <td>Très élevé</td>
                  <td><button class="ghost-btn" type="button">Voir</button></td>
                </tr>
                <tr data-search="Sotorasib KRAS très élevé RAS MAPK">
                  <td>Sotorasib</td>
                  <td>KRAS</td>
                  <td>89%</td>
                  <td>Très élevé</td>
                  <td><button class="ghost-btn" type="button">Voir</button></td>
                </tr>
                <tr data-search="Bevacizumab VEGFA élevé angiogenèse">
                  <td>Bevacizumab</td>
                  <td>VEGFA</td>
                  <td>86%</td>
                  <td>Élevé</td>
                  <td><button class="ghost-btn" type="button">Voir</button></td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
